    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationText = document.getElementById("explanation-text");
    const qNumber = document.getElementById("q-number");
    const scoreDisplay = document.getElementById("score-display");
    const nextBtn = document.getElementById("next-btn");
    const prevBtn = document.getElementById("prev-btn");
    const quizBox = document.getElementById("quiz-box");
    const resultBox = document.getElementById("result-box");
    const finalScoreText = document.getElementById("final-score-text");

    function loadQuestion() {
        const q = quizData[currentQuestionIndex];
        qNumber.innerText = `प्रश्न ${currentQuestionIndex + 1} / ${quizData.length}`;
        scoreDisplay.innerText = `स्कोर: ${score}`;
        questionText.innerText = q.question;
        
        optionsContainer.innerHTML = "";
        explanationText.style.display = "none";

        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            
            // यदि पहले से उत्तर दिया जा चुका है तो उसे हाईलाइट करें
            if (userAnswers[currentQuestionIndex] !== null) {
                if (index === q.answer) {
                    li.classList.add("correct");
                }
                if (userAnswers[currentQuestionIndex] === index && index !== q.answer) {
                    li.classList.add("wrong");
                }
            } else {
                li.onclick = () => selectOption(index);
            }
            optionsContainer.appendChild(li);
        });

        if (userAnswers[currentQuestionIndex] !== null) {
            explanationText.innerText = q.explanation;
            explanationText.style.display = "block";
        }

        prevBtn.style.display = currentQuestionIndex > 0 ? "inline-block" : "none";
        nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? "समाप्त करें" : "अगला प्रश्न →";
    }

    function selectOption(selectedIndex) {
        if (userAnswers[currentQuestionIndex] !== null) return; // एक बार चुनने के बाद बदलाव नहीं

        userAnswers[currentQuestionIndex] = selectedIndex;
        const q = quizData[currentQuestionIndex];
        const options = optionsContainer.children;

        if (selectedIndex === q.answer) {
            options[selectedIndex].classList.add("correct");
            score += 2; // प्रत्येक सही उत्तर पर 2 अंक
        } else {
            options[selectedIndex].classList.add("wrong");
            options[q.answer].classList.add("correct");
        }

        scoreDisplay.innerText = `स्कोर: ${score}`;
        explanationText.innerText = q.explanation;
        explanationText.style.display = "block";
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function showResult() {
        quizBox.style.display = "none";
        resultBox.style.display = "block";
        finalScoreText.innerText = `आपने ${quizData.length} में से ${score / 2} प्रश्न सही किए! कुल प्राप्तांक: ${score} / ${quizData.length * 2}`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswers.fill(null);
        quizBox.style.display = "block";
        resultBox.style.display = "none";
        loadQuestion();
    }

    function toggleTheme() {
        const body = document.body;
        if (body.getAttribute("data-theme") === "light") {
            body.setAttribute("data-theme", "dark");
        } else {
            body.setAttribute("data-theme", "light");
        }
    }

    // पहली बार लोड करें
    loadQuestion();
</script>
