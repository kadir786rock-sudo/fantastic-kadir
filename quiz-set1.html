<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>करेंट अफेयर्स क्विज़ - सेट 1 (सेविंग सपोर्ट)</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --card-bg: #fafafa;
            --border-color: #e0e0e0;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #f4f7f6;
            --card-bg: #2d2d2d;
            --border-color: #444444;
            --primary-color: #f4f7f6;
            --accent-color: #2980b9;
            --correct-color: #2ecc71;
            --wrong-color: #c0392b;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area h3 {
            color: var(--accent-color);
            font-size: 1.3rem;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .theme-btn, .back-btn, .reset-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .reset-btn {
            background: #e74c3c;
        }

        .quiz-title-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-title-box h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .quiz-title-box p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .q-number {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .q-text {
            font-size: 1.05rem;
            margin-bottom: 15px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-item:hover {
            border-color: var(--accent-color);
            background: rgba(52, 152, 219, 0.05);
        }

        .option-item input {
            margin-right: 10px;
        }

        .option-item.correct-ans {
            background: rgba(39, 174, 96, 0.2);
            border-color: var(--correct-color);
            color: var(--correct-color);
            font-weight: bold;
        }

        .option-item.wrong-ans {
            background: rgba(231, 76, 60, 0.2);
            border-color: var(--wrong-color);
            color: var(--wrong-color);
        }

        .explanation-box {
            display: none;
            margin-top: 12px;
            background: rgba(52, 152, 219, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .submit-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .submit-btn {
            background: var(--correct-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        .result-box {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .result-box h2 {
            color: var(--accent-color);
            margin-bottom: 8px;
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <header>
        <div class="logo-area">
            <h3>🌟 करेंट अफेयर्स पोर्टल</h3>
        </div>
        <div class="btn-group">
            <a href="current-affairs.html" class="back-btn">⬅ लिस्ट पर लौटे</a>
            <button class="theme-btn" onclick="toggleTheme()">🌙 मोड</button>
        </div>
    </header>

    <div class="quiz-title-box">
        <h1>करेंट अफेयर्स अभ्यास - सेट 1</h1>
        <p>उत्तर सेव रहेंगे। पेज रिफ्रेश होने पर भी आपकी प्रगति सुरक्षित रहेगी।</p>
    </div>

    <!-- रिजल्ट दिखाने का बॉक्स -->
    <div class="result-box" id="resultBox">
        <h2 id="resultTitle">📊 आपका परिणाम</h2>
        <p id="resultText" style="font-size: 1.1rem; font-weight: bold;"></p>
    </div>

    <!-- सभी प्रश्नों की सूची -->
    <div id="allQuestionsContainer">
        <p style="text-align: center; color: #7f8c8d;">प्रश्न लोड हो रहे हैं...</p>
    </div>

    <!-- सबमिट और रिसेट बटन -->
    <div class="submit-container" id="submitContainer">
        <button class="submit-btn" onclick="submitQuiz()">सभी उत्तर सबमिट करें & देखें स्कोर</button>
        <button class="reset-btn" onclick="resetQuiz()">🔄 क्विज़ रीसेट करें (다बारा शुरू करें)</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "सारस सर्किट (Sarus Circuit) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:\n1. यह उत्तर प्रदेश सरकार द्वारा शुरू की गई एक ईको-टूरिज्म और वन्यजीव संरक्षण पहल है।\n2. इस सर्किट को मैनपुरी और इटावा जिलों की आर्द्रभूमियों (wetlands) में विकसित किया जाएगा।\nउपर्युक्त कथनों में से कौन-सा/से सही है/हैं?",
            options: ["केवल 1", "केवल 2", "1 और 2 दोनों", "न तो 1 और न ही 2"],
            answer: 2,
            exp: "इसका उद्देश्य सारस क्रेन के संरक्षण को बढ़ावा देना है। सारस क्रेन उत्तर प्रदेश का राज्य पक्षी है और विश्व का सबसे ऊँचा उड़ने वाला पक्षी माना जाता है।"
        },
        {
            q: "प्रधानमंत्री गरीब कल्याण अन्न योजना (PMGKAY) के तहत केंद्रीय बैंक डिजिटल मुद्रा (CBDC) आधारित खाद्य सब्सिडी वितरण हेतु पायलट परियोजना हाल ही में कहाँ शुरू की गई है?",
            options: ["चंडीगढ़", "लक्षद्वीप", "पुडुचेरी", "दमन और दीव"],

        },
        {
            q: "भारत के मेट्रो नेटवर्क के संबंध में निम्नलिखित कथनों पर विचार कीजिए:\n1. वर्ष 2026 तक भारत का परिचालन मेट्रो नेटवर्क 1,143 किलोमीटर से अधिक हो गया है।\n2. कुल परिचालन मेट्रो नेटवर्क की लंबाई के आधार पर भारत, चीन और अमेरिका के बाद विश्व में तीसरे स्थान पर है।\nसही विकल्प चुनें:",
            options: ["केवल 1", "केवल 2", "1 और 2 दोनों", "न तो 1 और न ही 2"],
            answer: 2,
            exp: "भारत में मेट्रो नेटवर्क का लगातार विस्तार हो रहा है और लंबाई के मामले में यह वैश्विक स्तर पर तीसरे स्थान पर है।"

        {
            q: "मूनशॉट परियोजना (Moonshot Project) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:\n1. इसका उद्देश्य ब्रेन को-प्रोसेसर विकसित करना है जो न्यूरल संकेतों को डिकोड कर सकें।\n2. यह परियोजना IIT Madras द्वारा संचालित की जा रही है।\nकौन-सा सही है?",

        },

            answer: 2,
            exp: "दिल्ली सरकार ने इसे लॉन्च किया है जिससे महिलाएं और ट्रांसजेंडर डीटीसी और क्लस्टर बसों में मुफ्त यात्रा कर सकती हैं।"
        },
        {
            q: "'निर्भया निशा' (Nirbhaya Nisha) पहल, जिसका उद्देश्य रात के समय यात्रा करने वाली महिलाओं की सुरक्षा बढ़ाना है, किस राज्य द्वारा शुरू की गई है?",

        {
            q: "मुख्यमंत्री ग्राम परिवहन योजना के संदर्भ में:\n1. इसे 10 मार्च 2026 को यूपी मंत्रिमंडल द्वारा मंजूरी दी गई।\n2. इसका उद्देश्य गांवों को सीधे ब्लॉक व जिला मुख्यालयों से जोड़ना है।\n3. इसके तहत 15 से 28 सीट वाले छोटे वाहन चलेंगे।\nकौन-से सही हैं?",

        const container = document.getElementById("allQuestionsContainer");
        container.innerHTML = "";

        // सेव किए गए उत्तर और सबमिट स्टेटस लोड करें
        let savedAnswers = localStorage.getItem('quiz_answers_set1');
        if (savedAnswers) {
            userAnswers = JSON.parse(savedAnswers);
        }

        let savedSubmitState = localStorage.getItem('quiz_submitted_set1');
        if (savedSubmitState === 'true') {
            isSubmitted = true;
        }

        questions.forEach((q, index) => {
            let card = document.createElement("div");
            card.className = "question-card";

            let optionsHtml = "";
            q.options.forEach((opt, optIndex) => {
                let isChecked = (userAnswers[index] === optIndex) ? "checked" : "";
                let disabledAttr = isSubmitted ? "disabled" : "";
                
                optionsHtml += `
                    <label class="option-item" id="opt-${index}-${optIndex}">
                        <input type="radio" name="question-${index}" value="${optIndex}" ${isChecked} ${disabledAttr} onclick="selectOption(${index}, ${optIndex})">
                        ${String.fromCharCode(65 + optIndex)}. ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="q-number">प्रश्न ${index + 1} / ${questions.length}</div>
                <div class="q-text">${q.q}</div>
                <div class="options-list">${optionsHtml}</div>
                <div class="explanation-box" id="exp-${index}" style="display: ${isSubmitted ? 'block' : 'none'};">
                    <strong>स्पष्टीकरण:</strong> ${q.exp}
                </div>
            `;
            container.appendChild(card);
        });

        // अगर पहले ही सबमिट किया जा चुका है तो रिजल्ट और रंग दिखाएं
        if (isSubmitted) {
            applyResults();
        }
    }

    // विकल्प चुनने पर लोकल स्टोरेज में सेव करना
    function selectOption(qIndex, optIndex) {
        if (isSubmitted) return;
        userAnswers[qIndex] = optIndex;
        localStorage.setItem('quiz_answers_set1', JSON.stringify(userAnswers));
    }

    // रिजल्ट और रंगों को अप्लाई करना
    function applyResults() {
        let score = 0;

        questions.forEach((q, index) => {
            let selected = userAnswers[index];

            let correctOptEl = document.getElementById(`opt-${index}-${q.answer}`);
            if (correctOptEl) {
                correctOptEl.classList.add("correct-ans");
            }

            if (selected !== undefined && selected !== q.answer) {
                let wrongOptEl = document.getElementById(`opt-${index}-${selected}`);
                if (wrongOptEl) {
                    wrongOptEl.classList.add("wrong-ans");
                }
            }

            if (selected === q.answer) {
                score++;
            }
        });

        let resultBox = document.getElementById("resultBox");
        let resultText = document.getElementById("resultText");
        resultText.innerText = `आपने 50 में से ${score} प्रश्नों के सही उत्तर दिए हैं!`;
        resultBox.style.display = "block";

        document.getElementById("submitContainer").style.display = "none";
    }

    // सबमिट बटन पर क्लिक
    function submitQuiz() {
        let attempted = Object.keys(userAnswers).length;
        if (attempted === 0) {
            alert("कृपया कम से कम एक प्रश्न का उत्तर दें!");
            return;
        }

        isSubmitted = true;
        localStorage.setItem('quiz_submitted_set1', 'true');

        // रेडियो बटन्स को डिसएबल करें
        let allRadios = document.querySelectorAll('input[type="radio"]');
        allRadios.forEach(r => r.disabled = true);

        // स्पष्टीकरण दिखाएं
        questions.forEach((q, index) => {
            let expBox = document.getElementById(`exp-${index}`);
            if (expBox) expBox.style.display = "block";
        });

        applyResults();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // क्विज़ रीसेट करने का बटन
    function resetQuiz() {
        if (confirm("क्या आप वाकई इस क्विज़ को रीसेट करना चाहते हैं? आपके सभी उत्तर मिट जाएंगे।")) {
            localStorage.removeItem('quiz_answers_set1');
            localStorage.removeItem('quiz_submitted_set1');
            location.reload();
        }
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-btn');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️ लाइट';
        } else {
            body.setAttribute('data-theme', 'light');
            btn.innerText = '🌙 मोड';
        }
    }

    window.onload = renderQuiz;
</script>

</body>
</html>
