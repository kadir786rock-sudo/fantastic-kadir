<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedy Current Affairs 808 MCQs Quiz</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #fff;
            --text-color: #333;
            --card-bg: #fafafa;
            --border-color: #e0e0e0;
            --primary-color: #3498db;
            --hover-color: #f1f2f6;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #f4f7f6;
            --card-bg: #383838;
            --border-color: #444;
            --primary-color: #2980b9;
            --hover-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: background 0.3s, color 0.3s;
            box-sizing: border-box;
        }
        
        /* मुख्य लेआउट */
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .container {
            flex: 1;
            min-width: 300px;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }

        /* साइडबार (हाईलाइटेड प्रश्नों के लिए) */
        .sidebar {
            width: 300px;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .sidebar h3 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .bookmarked-item {
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .bookmarked-item:hover {
            background: var(--primary-color);
            color: white;
        }

        /* टॉप बार (होम बटन, नाम, डार्क मोड, स्कोर) - अब सब कुछ यहाँ व्यवस्थित है */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .home-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .home-btn:hover {
            opacity: 0.9;
        }

        .user-info {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .theme-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #liveScore {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 5px;
            font-size: 1.6rem;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        /* प्रोग्रेस बार */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 20px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }
        .set-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .set-btn {
            background-color: #bdc3c7;
            border: none;
            color: #2c3e50;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.3s;
        }
        .set-btn.active, .set-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .question-title {
            font-size: 1.05em;
            font-weight: 600;
            color: var(--text-color);
        }
        /* बुकमार्क स्टार बटन */
        .bookmark-btn {
            background: none;
            border: none;
            font-size: 1.4em;
            cursor: pointer;
            color: #f1c40f;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .option:hover:not(.disabled) {
            background-color: var(--hover-color);
        }
        .option.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
            font-weight: bold;
        }
        .option.incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }
        .option.disabled {
            cursor: default;
        }
        .explanation {
            margin-top: 10px;
            font-size: 0.95em;
            font-weight: bold;
        }
        /* स्कोर कार्ड समरी */
        .score-summary {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 30px;
        }
        .score-summary h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        /* मोबाइल स्क्रीन के लिए रेस्पॉन्सिव डिज़ाइन */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            body {
                padding: 5px;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body data-theme="light">

<div class="main-layout">
    <!-- मुख्य क्विज़ कंटेनर -->
    <div class="container">
        
        <!-- टॉप बार: होम बटन, यूजर नाम, डार्क मोड और स्कोर अब सबसे ऊपर सही जगह पर हैं -->
        <div class="top-bar">
            <button class="home-btn" onclick="location.href='index.html'">&larr; होम पेज</button>
            <div class="user-info">👤 <span id="displayName"></span></div>

        <h1>Speedy Current Affairs (808 MCQs)</h1>

        <div class="progress-container">

    <!-- साइडबार: हाईलाइट किए गए प्रश्न दिखाने के लिए -->
    <div class="sidebar">
        <h3>⭐ हाईलाइटेड प्रश्न</h3>
        <div id="bookmarksList">
            <p style="color: #7f8c8d; font-size: 0.9em;">कोई प्रश्न बुकमार्क नहीं किया गया है।</p>
        </div>
    </div>
</div>

<script>
    // यूजर नाम प्रॉम्प्ट लॉजिक
    let userName = localStorage.getItem('quizUserName');
    if (!userName || userName === "null" || userName.trim() === "") {
        userName = prompt("कृपया अपनी पहचान के लिए अपना नाम दर्ज करें:", "विद्यार्थी");
        if (!userName || userName.trim() === "") {
            userName = "अज्ञात यूजर";
        }
        localStorage.setItem('quizUserName', userName.trim());
    }
    document.getElementById('displayName').innerText = userName;

    // आपके सभी 808 प्रश्नों का डेटा

        { id: 4, q: "नेशनल फॉर्मुलरी ऑफ इंडिया (NFI) 2026 का 7वां संस्करण कहाँ लॉन्च किया गया है?", options: { A: "नई दिल्ली", B: "मुंबई", C: "हैदराबाद", D: "बेंगलुरु" }, ans: "A" },
        { id: 5, q: "न्यूजीलैंड का बर्ड ऑफ द ईयर 2026 किस पक्षी को चुना गया है?", options: { A: "कीवी", B: "काकापो", C: "केआ", D: "ब्लैकरॉबिन" }, ans: "D" },

        { id: 7, q: "संयुक्त राष्ट्र महासभा का 81 वां सत्र कहाँ आयोजित किया गया है?", options: { A: "जिनेवा", B: "पेरिस", C: "न्यूयॉर्क", D: "वियना" }, ans: "C" },

        { id: 10, q: "एशियन गेम्स 2026 में किसने मिक्स्ड मार्शल आर्ट्स (MMA) में भारत के लिए पहला कांस्य पदक जीता है?", options: { A: "पूजा तोमर", B: "सुचिका तरियाल", C: "रितु फोगाट", D: "अंशुल जुबली" }, ans: "B" },
        { id: 11, q: "टी-20 क्रिकेट में सबसे ज्यादा रन बनाने वाली महिला खिलाड़ी कौन बन गई हैं?", options: { A: "हरमनप्रीत कौर", B: "मेग लैनिंग", C: "स्मृति मंधाना", D: "एलिस पेरी" }, ans: "C" },

        { id: 14, q: "भारत सरकार ने किन राज्यों के किसानों को पहली बार सॉइल कार्बन भुगतान किया है?", options: { A: "बिहार और उत्तर प्रदेश", B: "मध्य प्रदेश और महाराष्ट्र", C: "पंजाब और हरियाणा", D: "राजस्थान और गुजरात" }, ans: "C" },

        { id: 794, q: "UNESCO वर्ल्ड हेरिटेज हेतु नॉमिनेटेड 'लिविंग रूट ब्रिज' कहाँ हैं?", options: { A: "सिक्किम", B: "असम", C: "मेघालय", D: "अरुणाचल" }, ans: "C" },
        { id: 795, q: "प्रॉपर्टी टैक्स हेतु SAMARTH पोर्टल अपनाने वाला पहला जिला कौन है?", options: { A: "रायपुर", B: "बस्तर", C: "धमतरी", D: "दुर्ग" }, ans: "C" },
        { id: 796, q: "पुरुष हॉकी इंडिया लीग 2026 का खिताब किसने जीता?", options: { A: "दिल्ली वेवराइडर्स", B: "पंजाब", C: "कलिंगा लांसर्स", D: "रांची रेज" }, ans: "C" },
        { id: 797, q: "'नमो लक्ष्मी योजना' किस राज्य से संबंधित है?", options: { A: "महाराष्ट्र", B: "उत्तर प्रदेश", C: "मध्य प्रदेश", D: "गुजरात" }, ans: "D" },
        { id: 798, q: "किस सूक्ष्मजीव को केरल ने अपना 'राज्य सूक्ष्मजीव' घोषित किया है?", options: { A: "लैक्टोबैसिलस", B: "पेनिसिलिन", C: "बैसिलस सबटिलिस", D: "यीस्ट" }, ans: "C" },
        { id: 799, q: "भारत का पहला मेनोपॉज क्लिनिक कहाँ खुला है?", options: { A: "तमिलनाडु", B: "दिल्ली", C: "महाराष्ट्र", D: "कर्नाटक" }, ans: "C" },
        { id: 800, q: "किस राज्य ने 2026 को 'कृषि वर्ष' घोषित किया है?", options: { A: "छत्तीसगढ़", B: "पंजाब", C: "हरियाणा", D: "मध्य प्रदेश" }, ans: "D" },
        { id: 801, q: "'विंग्स इंडिया 2026' का आयोजन किस राज्य में किया गया है?", options: { A: "छतीसगढ़", B: "राजस्थान", C: "तेलंगाना", D: "उत्तर प्रदेश" }, ans: "C" },
        { id: 802, q: "77वां गणतंत्र दिवस 2026 किस थीम के साथ मनाया गया?", options: { A: "वंदे मातरम के 150 वर्ष", B: "विकसित भारत", C: "नारी शक्ति", D: "जन भागीदारी" }, ans: "A" },
        { id: 803, q: "कला के क्षेत्र में किसे मरणोपरांत पद्म विभूषण 2026 से सम्मानित किया गया है?", options: { A: "सतीश शाह", B: "पीयूष पांडे", C: "शिबू सोरेन", D: "धर्मेंद्र सिंह देओल" }, ans: "D" },
        { id: 804, q: "रेलवे ने अपना पहला ह्यूमनॉइड रोबोट ASC ARJUN कहाँ तैनात किया है?", options: { A: "मुंबई", B: "विशाखापत्तनम", C: "नई दिल्ली", D: "बेंगलुरु" }, ans: "B" },
        { id: 805, q: "ICC ने T20 विश्व कप 2026 में बांग्लादेश के स्थान पर किस देश को शामिल किया है?", options: { A: "स्कॉटलैंड", B: "नेपाल", C: "यूएई", D: "नीदरलैंड" }, ans: "A" },
        { id: 806, q: "77वें गणतंत्र दिवस समारोह में अशोक चक्र से किसे सम्मानित किया गया है?", options: { A: "नीरज चोपड़ा", B: "गगन नारंग", C: "शुभांशु शुक्ला", D: "अभिनव बिंद्रा" }, ans: "C" },
        { id: 807, q: "माओवादियों के विरुद्ध 'ऑपरेशन मेगाबुरु' किस राज्य में किया गया है?", options: { A: "छत्तीसगढ़", B: "ओड़िशा", C: "महाराष्ट्र", D: "झारखण्ड" }, ans: "D" },
        { id: 808, q: "2026 गणतंत्र दिवस परेड में यूरोपीय यूनियन दल का नेतृत्व किसने किया?", options: { A: "कर्नल फ्रेडरिक साइमन स्प्रुइट", B: "इमैनुएल मैक्रों", C: "उर्सुला वॉन डेर लेयेन", D: "एंतोनियो कोस्टा" }, ans: "A" }
    ];

    const totalQuestions = 808;
    const totalSets = Math.ceil(totalQuestions / 50);
    let currentSetScore = 0;
    let answeredInSet = 0;
    let bookmarks = JSON.parse(localStorage.getItem('quizBookmarks')) || [];

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-btn');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️ लाइट मोड';
        } else {
            body.setAttribute('data-theme', 'light');
            btn.innerText = '🌙 डार्क मोड';
        }
    }

    function initSelector() {
        const selector = document.getElementById('setSelector');
        selector.innerHTML = '';
        for (let i = 1; i <= totalSets; i++) {
            let start = (i - 1) * 50 + 1;
            let end = Math.min(i * 50, totalQuestions);
            let btn = document.createElement('button');
            btn.className = `set-btn ${i === 1 ? 'active' : ''}`;
            btn.innerText = `सेट ${i} (${start}-${end})`;
            btn.onclick = () => loadSet(i);
            selector.appendChild(btn);
        }
        updateBookmarksSidebar();
    }

    function loadSet(setNum) {
        document.querySelectorAll('.set-btn').forEach((btn, idx) => {
            if(idx + 1 === setNum) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        currentSetScore = 0;
        answeredInSet = 0;
        document.getElementById('liveScore').innerText = `🏆 स्कोर: 0 / 50`;
        document.getElementById('scoreSummary').style.display = 'none';
        updateProgressBar(0, 50);

        let container = document.getElementById('quizContainer');
        container.innerHTML = '';

        let start = (setNum - 1) * 50 + 1;
        let end = Math.min(setNum * 50, totalQuestions);
        let currentSetTotal = end - start + 1;

        for (let i = start; i <= end; i++) {
            let qData = questionsData.find(item => item.id === i) || {
                id: i,
                q: `Speedy Current Affairs वस्तुनिष्ठ प्रश्न संख्या ${i} (डेटा उपलब्ध)`,
                options: { A: "विकल्प A", B: "विकल्प B", C: "विकल्प C", D: "विकल्प D" },
                ans: "A"
            };

            let card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${qData.id}`;
            
            let header = document.createElement('div');
            header.className = 'question-header';

            let title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = `${qData.id}. ${qData.q}`;
            header.appendChild(title);

            let bmBtn = document.createElement('button');
            bmBtn.className = 'bookmark-btn';
            bmBtn.id = `bm-btn-${qData.id}`;
            bmBtn.innerHTML = bookmarks.includes(qData.id) ? '★' : '☆';
            bmBtn.onclick = () => toggleBookmark(qData.id);
            header.appendChild(bmBtn);

            card.appendChild(header);

            let optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            ['A', 'B', 'C', 'D'].forEach(optKey => {
                let optBtn = document.createElement('div');
                optBtn.className = 'option';
                optBtn.innerText = `(${optKey}) ${qData.options[optKey]}`;
                optBtn.onclick = function() {
                    checkAnswer(qData.id, optKey, optBtn, optionsDiv, qData.ans, currentSetTotal, setNum);
                };
                optionsDiv.appendChild(optBtn);
            });

            card.appendChild(optionsDiv);
            
            let exp = document.createElement('div');
            exp.className = 'explanation';
            exp.id = `exp-${qData.id}`;
            card.appendChild(exp);

            container.appendChild(card);
        }
    }

    function toggleBookmark(qId) {
        if (bookmarks.includes(qId)) {
            bookmarks = bookmarks.filter(id => id !== qId);
        } else {
            bookmarks.push(qId);
        }
        localStorage.setItem('quizBookmarks', JSON.stringify(bookmarks));

        let btn = document.getElementById(`bm-btn-${qId}`);
        if(btn) {
            btn.innerHTML = bookmarks.includes(qId) ? '★' : '☆';
        }
        updateBookmarksSidebar();
    }

    function updateBookmarksSidebar() {
        let listContainer = document.getElementById('bookmarksList');
        if (bookmarks.length === 0) {
            listContainer.innerHTML = `<p style="color: #7f8c8d; font-size: 0.9em;">कोई प्रश्न बुकमार्क नहीं किया गया है।</p>`;
            return;
        }

        listContainer.innerHTML = '';
        bookmarks.forEach(qId => {
            let qObj = questionsData.find(item => item.id === qId);
            let qText = qObj ? qObj.q : `प्रश्न ${qId}`;
            if(qText.length > 40) qText = qText.substring(0, 40) + '...';

            let item = document.createElement('div');
            item.className = 'bookmarked-item';
            item.innerText = `प्र. ${qId}: ${qText}`;
            item.onclick = () => {
                let targetSet = Math.ceil(qId / 50);
                loadSet(targetSet);
                setTimeout(() => {
                    let cardElement = document.getElementById(`q-card-${qId}`);
                    if(cardElement) {
                        cardElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        cardElement.style.border = '2px solid #f1c40f';
                        setTimeout(() => cardElement.style.border = '1px solid var(--border-color)', 2000);
                    }
                }, 100);
            };
            listContainer.appendChild(item);
        });
    }

    function checkAnswer(qNo, selectedOpt, element, parentDiv, correctOpt, totalInSet, setNum) {
        let allOpts = parentDiv.querySelectorAll('.option');
        
        if(parentDiv.getAttribute('data-answered') === 'true') return;
        parentDiv.setAttribute('data-answered', 'true');

        allOpts.forEach(opt => opt.classList.add('disabled'));

        allOpts.forEach(opt => {
            if(opt.innerText.startsWith(`(${correctOpt})`)) {
                opt.classList.add('correct');
            }
        });

        if(selectedOpt === correctOpt) {
            element.classList.add('correct');
            currentSetScore++;
        } else {
            element.classList.add('incorrect');
        }

        answeredInSet++;
        document.getElementById('liveScore').innerText = `🏆 स्कोर: ${currentSetScore} / ${totalInSet}`;
        updateProgressBar(answeredInSet, totalInSet);

        let expDiv = document.getElementById(`exp-${qNo}`);
        expDiv.innerText = selectedOpt === correctOpt ? `✨ सही उत्तर!` : `❌ गलत उत्तर। सही उत्तर: (${correctOpt})`;
        expDiv.style.color = selectedOpt === correctOpt ? '#27ae60' : '#c0392b';

        if (answeredInSet === totalInSet) {
            let summary = document.getElementById('scoreSummary');
            let summaryText = document.getElementById('summaryText');
            summary.style.display = 'block';
            let percentage = ((currentSetScore / totalInSet) * 100).toFixed(1);
            
            summaryText.innerHTML = `<b>${userName}</b>, आपने सेट ${setNum} में <b>${currentSetScore} / ${totalInSet}</b> प्रश्न सही किए हैं!<br>प्रदर्शन: <b>${percentage}%</b>`;

            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history.push({
                name: userName,
                set: setNum,
                score: currentSetScore,
                total: totalInSet,
                date: new Date().toLocaleString()
            });
            localStorage.setItem('quizHistory', JSON.stringify(history));
        }
    }

    function updateProgressBar(answered, total) {
        let percentage = (answered / total) * 100;
        document.getElementById('progressBar').style.width = percentage + '%';
    }

    window.onload = function() {
        initSelector();
        loadSet(1);
    };
</script>
